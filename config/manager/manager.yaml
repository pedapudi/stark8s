apiVersion: v1
kind: Namespace
metadata:
  name: stark8s-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stark8s-controller
  namespace: stark8s-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stark8s-controller
rules:
  - apiGroups: ["stark8s.io"]
    resources: ["workloads", "workloads/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts", "pods"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stark8s-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stark8s-controller
subjects:
  - kind: ServiceAccount
    name: stark8s-controller
    namespace: stark8s-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stark8s-controller
  namespace: stark8s-system
  labels:
    app: stark8s-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stark8s-controller
  template:
    metadata:
      labels:
        app: stark8s-controller
    spec:
      serviceAccountName: stark8s-controller
      containers:
        - name: controller
          image: stark8s:dev
          imagePullPolicy: IfNotPresent
          args: ["--coordinator-image=stark8s:dev"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests: {cpu: 100m, memory: 128Mi}
