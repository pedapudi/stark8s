# Map/shuffle/reduce. "shuffle" is a Materialized Hash channel: reduce is not
# started until map has completed, and each reduce replica owns a fixed set of
# key partitions — the stage barrier and exchange of a Spark shuffle.
#
# Replica counts follow the coordinator's count of runnable partitions:
# replicas = clamp(ceil(runnableTasks / slots), min, max).
apiVersion: stark8s.io/v1alpha1
kind: Workload
metadata:
  name: wordcount
spec:
  operations:
    - name: read
      template:
        spec:
          containers:
            - name: main
              image: stark8s:dev
              imagePullPolicy: IfNotPresent
              command: ["/wordcount", "read"]
    - name: map
      slots: 2
      scaling:
        horizontal: {min: 1, max: 4}
      template:
        spec:
          containers:
            - name: main
              image: stark8s:dev
              imagePullPolicy: IfNotPresent
              command: ["/wordcount", "map"]
    - name: reduce
      slots: 2
      scaling:
        horizontal: {min: 1, max: 3}
      template:
        spec:
          containers:
            - name: main
              image: stark8s:dev
              imagePullPolicy: IfNotPresent
              command: ["/wordcount", "reduce"]
  channels:
    - name: lines
      from: read
      to: map
      partitioning: {mode: RoundRobin, partitions: 8}
      delivery: Pipelined
    - name: shuffle
      from: map
      to: reduce
      partitioning: {mode: Hash, partitions: 6}
      delivery: Materialized
    - name: totals
      from: reduce
      # No consumer: results are read from outside through the coordinator API.
