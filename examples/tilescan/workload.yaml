# Fan-out/gather: the shape of a task-parallel program built from futures.
#
# A driver would hold a big array, put a shared calibration table into the
# object store, submit one task per chunk, and wait on the list of futures.
# Here "plan" emits the chunk descriptors, "scan" is the task pool, and the
# gather is expressed by the Hash partitioning and drain of "hits" rather
# than by a process waiting on futures. There is no driver at run time.
apiVersion: stark8s.io/v1alpha1
kind: Workload
metadata:
  name: tilescan
spec:
  operations:
    # Exactly one replica: every replica of a source operation runs its
    # Source handler independently, so more than one would duplicate the
    # work list.
    - name: plan
      scaling:
        horizontal: {min: 1, max: 1}
      template:
        spec:
          containers:
            - name: main
              image: stark8s:dev
              imagePullPolicy: IfNotPresent
              command: ["/tilescan", "plan"]
    # The task pool. Replica count follows the runnable partitions of
    # "tiles", which is the autoscaling a Ray cluster would do by adding
    # workers when the pending-task queue grows.
    - name: scan
      slots: 1
      scaling:
        horizontal: {min: 1, max: 8}
      template:
        spec:
          containers:
            - name: main
              image: stark8s:dev
              imagePullPolicy: IfNotPresent
              command: ["/tilescan", "scan"]
    - name: reduce
      slots: 1
      scaling:
        horizontal: {min: 1, max: 4}
      template:
        spec:
          containers:
            - name: main
              image: stark8s:dev
              imagePullPolicy: IfNotPresent
              command: ["/tilescan", "reduce"]
  channels:
    # The shared object: one copy per consuming replica, not one pointer
    # per task into a shared-memory store.
    - name: calib
      from: plan
      to: scan
      partitioning: {mode: Broadcast, partitions: 1}
      delivery: Pipelined
    # The work queue. RoundRobin because a tile has no key affinity; the
    # partition count is the ceiling on scan's useful parallelism.
    - name: tiles
      from: plan
      to: scan
      partitioning: {mode: RoundRobin, partitions: 8}
      delivery: Pipelined
    # The gather. Hash on the band means every result for a band reaches
    # one reducer; Materialized means reduce is not started until scan has
    # finished, which is the barrier the driver's get(futures) imposes.
    - name: hits
      from: scan
      to: reduce
      partitioning: {mode: Hash, partitions: 4}
      delivery: Materialized
    # No consumer: the summaries are read from outside through the
    # coordinator API.
    - name: regions
      from: reduce
